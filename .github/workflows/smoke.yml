# MANUAL + NIGHTLY ONLY. Runs `claude -p` sessions over the true Nazgul entry
# paths (heartbeat tick, bounded loop dry-run) against throwaway scratch
# projects — it costs money and minutes. Never wire this to push/pull_request:
# the CI-cheap half lives in tests/test-smoke-shape.sh, which the normal suite
# (test.yml) already runs on every push.
name: Headless Smoke (manual/nightly)
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      scenario_filter:
        description: 'Scenario filter (heartbeat | loop; empty runs both)'
        required: false
        default: ''
  schedule:
    - cron: '0 7 * * *'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run headless smoke
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Via env, never interpolated into the script body: a dispatch input is
          # operator-supplied text and belongs in the environment, not in argv-by-substitution.
          SCENARIO_FILTER: ${{ inputs.scenario_filter }}
        run: |
          bash tests/smoke/run-smoke.sh \
            --filter="$SCENARIO_FILTER" \
            --inbox-dir="$GITHUB_WORKSPACE/nazgul/inbox" \
            --timeout=600

      - name: Upload the p1 inbox item filed by a smoke failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure-inbox-items
          path: nazgul/inbox/smoke-failure-*.md
          if-no-files-found: warn
